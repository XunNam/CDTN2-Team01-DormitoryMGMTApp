<!doctype html><html lang="vi"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--canvas);color:var(--ink);font-family:var(--font-sans)}*{box-sizing:border-box}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}fieldset{border:0;margin:0;padding:0;max-width:424px}legend{font-size:14px;font-weight:600;margin-bottom:12px}.group{display:flex;gap:8px;padding:4px;background:var(--subtle);border-radius:var(--radius-group)}label{flex:1;position:relative}input{position:absolute;opacity:0;width:100%;height:100%;margin:0}span{display:flex;justify-content:center;align-items:center;gap:8px;height:48px;border-radius:var(--radius-control);font-size:14px;font-weight:600}input:checked+span{background:var(--primary);color:var(--on-primary)}input:checked+span:before{content:"✓"}input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}</style></head><body><fieldset><legend>Nhóm tài khoản</legend><div class="group"><label><input type="radio" name="accountType" value="STUDENT" checked><span>Sinh viên</span></label><label><input type="radio" name="accountType" value="STAFF"><span>Nhân sự</span></label></div></fieldset></body></html>
