<!doctype html><html lang="vi"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-sans)}
.cover{position:relative;width:960px;height:320px;overflow:hidden}
svg{position:absolute;inset:0}.brand{fill:var(--primary)}.accent{fill:var(--accent)}.relief{fill:var(--subtle)}.ground{fill:var(--canvas)}.tile{rx:var(--radius-control)}
h1{position:absolute;left:32px;bottom:68px;margin:0;font:600 72px/.95 var(--font-display);letter-spacing:-3px}
p{position:absolute;left:32px;bottom:28px;max-width:420px;margin:0;font-size:14px;line-height:24px;color:var(--muted)}
</style></head><body><div class="cover">
<!-- Blocks: primary 256×320, accent 160×224, subtle 96×320; multiples of space-8.
Arrangement: architectural masses at x≥480, stepped upward toward right.
Pattern: geometric modular tiles, echoing the README's decorative dormitory windows.
Scales: space-8, space-16, space-32; radius-control 8px. -->
<svg viewBox="0 0 960 320" aria-hidden="true"><rect class="relief" x="480" y="0" width="96" height="320"/><rect class="brand" x="576" y="0" width="256" height="320"/><rect class="accent" x="800" y="96" width="160" height="224"/>
<g class="accent tile"><rect x="608" y="32" width="32" height="48"/><rect x="656" y="32" width="32" height="48"/><rect x="704" y="32" width="32" height="48"/><rect x="752" y="32" width="32" height="48"/><rect x="608" y="96" width="32" height="48"/><rect x="656" y="96" width="32" height="48"/><rect x="704" y="96" width="32" height="48"/><rect x="752" y="96" width="32" height="48"/></g>
<g class="ground tile"><rect x="608" y="176" width="80" height="112"/><rect x="704" y="176" width="64" height="48"/><rect x="704" y="240" width="64" height="48"/></g>
<g class="brand tile"><rect x="832" y="128" width="32" height="48"/><rect x="880" y="128" width="32" height="48"/><rect x="832" y="192" width="32" height="48"/><rect x="880" y="192" width="32" height="48"/><rect x="832" y="256" width="80" height="64"/></g>
</svg><h1>DormFlow</h1><p>Đăng ký chỗ ở. Theo dõi dễ dàng.</p></div></body></html>
