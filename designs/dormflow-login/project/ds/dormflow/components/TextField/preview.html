<!-- @dsCard group="Authentication" height=288 subtitle="Nhãn luôn hiện · cho phép password manager" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--canvas);color:var(--ink);font-family:var(--font-sans)}*{box-sizing:border-box}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.stack{display:flex;flex-direction:column;gap:8px;max-width:424px}label{font-size:14px;font-weight:600}input{width:100%;height:52px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius-control);color:var(--ink);background:var(--on-primary)}input::placeholder{color:var(--muted)}label[for=password]{margin-top:16px}.password{position:relative}.password input{padding-right:80px}.password button{position:absolute;right:4px;top:4px;height:44px;min-width:64px;border:0;border-radius:var(--radius-control);background:var(--on-primary);color:var(--primary);font-size:13px;font-weight:600}</style></head><body><div class="stack"><label for="identifier">Mã số sinh viên</label><input id="identifier" name="identifier" autocomplete="username" placeholder="Nhập mã số sinh viên" spellcheck="false"><label for="password">Mật khẩu</label><div class="password"><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu"><button id="show" type="button" aria-controls="password" aria-pressed="false">Hiện</button></div></div><script>document.getElementById('show').addEventListener('click',function(){const p=document.getElementById('password');const show=p.type==='password';p.type=show?'text':'password';this.textContent=show?'Ẩn':'Hiện';this.setAttribute('aria-pressed',String(show));});</script></body></html>
